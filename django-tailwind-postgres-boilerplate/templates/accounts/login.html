{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
  <h1 class="text-2xl font-bold mb-6">Log in</h1>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {% if form.errors %}
      <div class="rounded-md bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3">
        Your username and password didn't match. Please try again.
      </div>
    {% endif %}
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
      {{ form.username }}
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
      {{ form.password }}
    </div>
    <button type="submit" class="w-full rounded-md bg-slate-900 text-white py-2 font-medium hover:bg-slate-700">
      Log in
    </button>
  </form>
  <p class="mt-4 text-sm text-slate-600">
    Don't have an account? <a href="{% url 'accounts:signup' %}" class="text-slate-900 font-medium underline">Sign up</a>
  </p>
</div>
{% endblock %}

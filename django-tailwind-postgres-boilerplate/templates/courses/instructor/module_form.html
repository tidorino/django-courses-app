{% extends "base.html" %}
{% block title %}Add Module{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto px-4 py-12">
  <a href="{% url 'courses:instructor_course_edit' course.slug %}" class="text-sm text-slate-500 hover:text-slate-800">&larr; Back to {{ course.title }}</a>
  <h1 class="text-2xl font-bold mt-4 mb-6">Add module</h1>
  <form method="post" class="space-y-5">
    {% csrf_token %}
    {% for field in form %}
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<p class="text-sm text-red-600 mt-1">{{ field.errors|join:", " }}</p>{% endif %}
      </div>
    {% endfor %}
    <button type="submit" class="rounded-md bg-slate-900 text-white px-5 py-2.5 font-medium hover:bg-slate-700">
      Add module
    </button>
  </form>
</div>
{% endblock %}
